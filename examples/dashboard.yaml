# Example dashboard view for the Laundry Advisor.
# Paste into your Lovelace YAML or adopt as a new view.

title: Laundry
path: laundry
icon: mdi:tshirt-crew
cards:
  # --- main card ---
  - type: custom:laundry-advisor-card
    entity: sensor.laundry_advisor
    name: Laundry
    show_rooms: true
    show_reasons: true

  # --- control helper ---
  - type: entities
    title: Control
    entities:
      - entity: input_boolean.laundry_washed
        name: Laundry is washed
      # optional, if used by the notify automation:
      # - fan.basement_fan
      # - switch.basement_dehumidifier

  # --- fallback / detail view without the custom card ---
  - type: entities
    title: Advisor – raw values
    entities:
      - type: attribute
        entity: sensor.laundry_advisor
        attribute: headline
        name: Recommendation
      - type: attribute
        entity: sensor.laundry_advisor
        attribute: outdoor_score
        name: Outdoor score today
        suffix: " / 100"
      - type: attribute
        entity: sensor.laundry_advisor
        attribute: outdoor_score_tomorrow
        name: Outdoor score tomorrow
        suffix: " / 100"
      - type: attribute
        entity: sensor.laundry_advisor
        attribute: outdoor_score_day_after
        name: Outdoor score day after
        suffix: " / 100"
      - type: attribute
        entity: sensor.laundry_advisor
        attribute: best_window_start_hour
        name: Window from (hour)
      - type: attribute
        entity: sensor.laundry_advisor
        attribute: daylight_left_h
        name: Daylight left (h)

  # --- debug: room assessment ---
  - type: entities
    title: Rooms (debug)
    entities:
      - entity: sensor.laundry_advisor
        type: attribute
        attribute: recommended_room
        name: Recommended room
      - entity: sensor.laundry_advisor
        type: attribute
        attribute: rooms
        name: rooms object

  # --- score history (optional, core HA card) ---
  - type: history-graph
    title: Outdoor score history
    hours_to_show: 72
    entities:
      - entity: sensor.laundry_advisor
